name: Update prices

# Runs every 6 hours, and whenever you press "Run workflow" on the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read prices from Checkfront
        id: build
        run: node build-prices.mjs
        env:
          CF_KEY: ${{ secrets.CF_KEY }}
          CF_SECRET: ${{ secrets.CF_SECRET }}

      - name: Publish prices.json
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "esw-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json
          git commit -m "Update prices"
          git push

      - name: Email a note when a "from" price changes
        if: steps.build.outputs.headline == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Website from prices changed ($(date +'%d %b %Y'))" --body-file changes.md
